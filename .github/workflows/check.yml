name: Tests and source package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test resource transformations
        run: python -m unittest discover -s tests -v
      - name: Package source
        run: python pack.py
      - name: Upload source package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: source-package-${{ matrix.os }}
          path: dist/*
